<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="/Styles/estilos sesion/resgistrarse.css">
</head>
<body class="body">
    <header class="header">
        <img src="/images/icons/Logo.png" alt="LOGO" class="logo">
                <h2 class="titulo">REGISTRARSE</h2>
                <a href="/index.html">
                    <img src="/images/icons/Home.png" alt="Home" >
                </a>
    </header>
    <form class="formRegistro">
        <fieldset class="contenido">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>
            <label for="tel">Telefono Celular:</label>
            <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" required>
            
            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            <label for="select">País:</label>
            <select name="pais" id="pais">
                <option value="colombia">Afganistán</option>
                <option value="estadosUnidos">Albania</option>
                <option value="mexico">Alemania</option>
                <option value="argentina">Andorra</option>
                <option value="brasil">etc</option>
            </select>
            <label for="select">Ciudad:</label>
            <select name="ciudad" id="ciudad">
                <option value="colombia">Acandí</option>
                <option value="estadosUnidos">Aguachica</option>
                <option value="mexico">Apartadó</option>
                <option value="argentina">Arauca</option>
                <option value="brasil">etc</option>
            </select>
            <label for="email">Correo Electronico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <label for="confirmPassword">Confirmar contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>

            <button type="submit">Registrarse</button>
         </fieldset>
    </form>
</body>
</html>
