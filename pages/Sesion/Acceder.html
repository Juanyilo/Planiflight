<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder</title>
    <link rel="stylesheet" href="/Styles/estilos sesion/acceder.css">
</head>
<body class="body">
    <header class="header">
        <img src="/images/icons/Logo.png" alt="LOGO" class="logo">
                <h2 class="titulo">ACCEDER</h2>
                <a href="/index.html">
                    <img src="/images/icons/Home.png" alt="Home">
                </a>
    </header>
    <form class="acceder">
        <fieldset>
            <label for="email">Correo Electronico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <div class="botones">
                    <button type="submit">Acceder</button>
                    <button type="button" onclick="window.location.href='Registrarse.html'">
                        Crear Cuenta
                    </button>   

            </div>
            
        </fieldset>
        
    </form>
    
</body>
</html>
